services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pharmacy1os
      POSTGRES_PASSWORD: pharmacy1os_dev
      POSTGRES_DB: pharmacy1os
    ports:
      - "5432:5432"
    volumes:
      - pharmacy1os_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy1os -d pharmacy1os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pharmacy1os_postgres:
