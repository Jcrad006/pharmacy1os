name: CI

on:
  push:
    branches: [main, phase1-synthetic-dispensing]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pharmacy1os:pharmacy1os_dev@localhost:5432/pharmacy1os?schema=public
      WEB_ORIGIN: http://localhost:5173
      ALLOW_DEV_IDENTITY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
