name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pharmacy1os
          POSTGRES_PASSWORD: pharmacy1os_dev
          POSTGRES_DB: pharmacy1os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy1os -d pharmacy1os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pharmacy1os:pharmacy1os_dev@localhost:5432/pharmacy1os?schema=public
      WEB_ORIGIN: http://localhost:5173
      ALLOW_DEV_IDENTITY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact reviewed dependency graph
        run: pnpm install --frozen-lockfile

      - name: Assert lockfile was not altered
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Generate dependency SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: pharmacy1os-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Apply database migrations (including invariant checks)
        run: pnpm db:deploy
      - name: Load synthetic seed data
        run: pnpm db:seed
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (including Stage 3L.3 adversarial cases)
        run: pnpm test
      - name: Production dependency vulnerability gate (high and critical)
        run: pnpm audit --prod --audit-level high
      - name: Build
        run: pnpm build

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pharmacy1os
          POSTGRES_PASSWORD: pharmacy1os_dev
          POSTGRES_DB: pharmacy1os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy1os -d pharmacy1os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: postgresql://pharmacy1os:pharmacy1os_dev@localhost:5432/pharmacy1os?schema=public
      WEB_ORIGIN: http://localhost:5173
      ALLOW_DEV_IDENTITY: "true"
      CLAIM_SANDBOX_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - name: Install Chromium and required Linux libraries
        run: pnpm --filter @pharmacy1os/api exec playwright install --with-deps chromium
      - name: Full browser dispensing and paid-claim POS journey
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pharmacy1os/api dev > /tmp/pharmacy1os-api-e2e.log 2>&1 &
          api_pid=$!
          pnpm --filter @pharmacy1os/web dev --host 127.0.0.1 > /tmp/pharmacy1os-web-e2e.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 75); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health &&
               curl -fsS -o /dev/null http://127.0.0.1:5173; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Synthetic API or Vite webserver failed to start"
            cat /tmp/pharmacy1os-api-e2e.log
            cat /tmp/pharmacy1os-web-e2e.log
            exit 1
          fi
          pnpm --filter @pharmacy1os/api test:e2e

      - name: Upload E2E debugging artifacts if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failures
          path: |
            apps/api/playwright-report/
            apps/api/test-results/
          if-no-files-found: ignore
          retention-days: 7
