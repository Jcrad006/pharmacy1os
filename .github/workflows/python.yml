name: Python-native migration checks

on:
  push:
    branches: [python-native-rewrite]
  pull_request:
    paths:
      - "python/**"
      - "docs/PYTHON_MIGRATION.md"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install synthetic Python service and test dependencies
        run: python -m pip install -e './python[test]'
      - name: Compile all migrated Python modules
        run: python -m compileall -q python/pharmacy1os
      - name: Run synthetic Python workflow and API tests
        run: python -m pytest -q python/tests

  native-prescription-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install native workstation and test dependencies
        run: python -m pip install -e './python[test,desktop]'
      - name: Exercise native prescription form and permission conflicts
        run: python -m pytest -q python/tests/test_desktop_prescription.py
